cludes:["Guide","Meals","Camping","Mules"],bestSeason:"Jun-Oct"},{id:9,name:"Sandakphu",location:"West Bengal",region:"Himalaya",duration:"6D / 5N",durationDays:6,difficulty:"Moderate",price:7999,originalPrice:10999,rating:4.7,reviews:432,gradient:"from-orange-300 to-red-500",emoji:"\uD83C\uDF04",includes:["Guide","Meals","Stay","Kanchenjunga View"],bestSeason:"Oct-Dec, Mar-May"},{id:10,name:"Chadar Frozen River",location:"Ladakh",region:"Himalaya",duration:"9D / 8N",durationDays:9,difficulty:"Hard",price:19999,originalPrice:28999,rating:4.9,reviews:321,gradient:"from-blue-200 to-cyan-400",emoji:"\uD83E\uDDCA",includes:["Guide","Meals","Safety Gear","Medical"],bestSeason:"Jan-Feb"},{id:11,name:"Rajmachi Fort Trek",location:"Maharashtra",region:"Western Ghats",duration:"2D / 1N",durationDays:2,difficulty:"Easy",price:2299,originalPrice:3499,rating:4.6,reviews:567,gradient:"from-green-400 to-emerald-600",emoji:"\uD83C\uDFF0",includes:["Guide","Meals","Camping","Fort Visit"],bestSeason:"Jun-Feb"},{id:12,name:"Kudremukh",location:"Karnataka",region:"Western Ghats",duration:"2D / 1N",durationDays:2,difficulty:"Moderate",price:2799,originalPrice:3999,rating:4.7,reviews:412,gradient:"from-emerald-300 to-green-600",emoji:"\uD83D\uDC18",includes:["Guide","Meals","Homestay","Permit"],bestSeason:"Oct-Feb"},{id:13,name:"Dzouku Valley",location:"Nagaland",region:"Northeast",duration:"3D / 2N",durationDays:3,difficulty:"Moderate",price:6499,originalPrice:8999,rating:4.9,reviews:189,gradient:"from-violet-400 to-purple-600",emoji:"\uD83C\uDF3F",includes:["Guide","Meals","Camping","ILP"],bestSeason:"Jun-Sep, Oct-Nov"},{id:14,name:"Araku Valley",location:"Andhra Pradesh",region:"Northeast",duration:"2D / 1N",durationDays:2,difficulty:"Easy",price:2499,originalPrice:3599,rating:4.5,reviews:234,gradient:"from-amber-300 to-orange-500",emoji:"☕",includes:["Guide","Coffee Tour","Stay","Meals"],bestSeason:"Oct-Mar"},{id:15,name:"Chembra Peak",location:"Kerala",region:"Western Ghats",duration:"1D",durationDays:1,difficulty:"Moderate",price:1999,originalPrice:2999,rating:4.8,reviews:378,gradient:"from-teal-400 to-emerald-600",emoji:"\uD83D\uDC9A",includes:["Guide","Heart Lake","Permit"],bestSeason:"Sep-Feb"}],_v=[{id:1,title:"Mount Abu: The Hidden Trekking Paradise of Rajasthan - Complete Guide",excerpt:"Beyond the touristy Nakki Lake lies a network of ancient Aravalli trails, leopard territories and 1000-year-old temples. Here's everything about trekking Abu Road.",content:`Mount Abu is often dismissed as just a hill station, but for trekkers it is Rajasthan's only true escape. Unlike the Thar, here the Aravalli rises to 1722m at Guru Shikhar. 

We start from Abu Road Railway Station at 5:30 AM. The 27km ghat road itself is a prelude. Our base at Delwara is where we leave the jeeps and start walking.

Three trails you must do:
1. **Toad Rock to Sunset Point via Crocodile Rock** - 4km ridge walk, best for monsoon.
2. **Achalgarh Fort to Trevor's Tank** - 7km jungle, 80% chance of spotting bears and hyenas.
3. **Guru Shikhar via Kodra Dam** - The real approach, not the roadside steps.

Cost? With TrekYatri, Rs 2499 includes pickup from Abu Road, forest permits (Rs 200 value), guide who knows leopard movement, and local Garasia tribal lunch.

Pro Tip: Carry 2L water. No shops after Delwara. And avoid white clothes - the langurs will target you.

We run this every Fri-Sun. Pickup from Ahmedabad at 10 PM Thursday via sleeper bus.`,date:"12 Dec 2024",author:"Arav Mehta",readTime:"6 min",emoji:"\uD83C\uDFDC️",gradient:"from-emerald-500 to-teal-600",category:"Abu Road"},{id:2,title:"Guru Shikhar Night Trek - Chasing Sunrise at Rajasthan's Highest Peak",excerpt:"We started at 2 AM from Mount Abu with headlamps. What happened at 1722m at 5:47 AM changed our idea of Rajasthan forever.",content:`Guru Shikhar is not a trek, it's a pilgrimage for those who hate pilgrimages.

The usual tourists take 300 steps from the parking lot. We take the old Jain trail from Achalgarh, 5.5km, 600m elevation gain, through dense forest where the ancient temples are still active.

Night trek briefing: Reach base by 1:30 AM. Tea at our partner stall. Start by 2 AM. Why night? Two reasons - avoid the 36C day heat and see the sunrise that makes the entire Aravalli range glow orange.

At the top, Dattatreya temple priests offer chai at 5 AM. From here you can see Abu Road lights on one side and Mount Abu town on other. On clear winter days, you see Thar shimmering.

Price Rs 1999 includes: pickup from Abu Road Railway Station (any train), guide, torch, temple offering, and sunrise breakfast with poha at Kodra.

Safety: We provide one guide per 8 people. No one walks alone after 3 AM. Leopards are there but shy.

Next batches: Every Saturday night, 15 slots only. Book 3 days prior for forest permission.`,date:"05 Dec 2024",author:"Priya Sharma",readTime:"4 min",emoji:"\uD83C\uDF04",gradient:"from-orange-400 to-amber-500",category:"Abu Road"},{id:3,title:"5 Secret Jungle Trails Around Abu Road That No One Tells You",excerpt:"Forget Nakki Lake. These trails have no signboards, no crowd, and require a local guide. We mapped them with the forest department.",content:`After 3 years and 200+ treks around Abu Road, our guides agreed to share 5 trails that are still secret:

1. **Oriya Block - Leopard Lair Trail**: 3km, inside Abu Road Sanctuary. You need forest dept permission which we arrange. Pugmarks guaranteed in winter.

2. **Sana Village to Mt. Abu via Tribal Hamlet**: 9km, meet Garasia tribals, their mahua brew if you're lucky.

3. **Trevor's Tank to Gaumukh Underground Spring**: The tank was built by British engineer Trevor for crocodile breeding. Behind it, a 400m tunnel leads to a perennial spring. Entry is restricted.

4. **Gurushan Plateau - Wind Farm Trail**: Not on maps. 20 windmills, 270-degree view, perfect for camping. We have permission for 1 night camping.

5. **Brahmakumari Shantivan to Mt. Abu Old Footpath**: Used by pilgrims before road was built. 11km, 80% descent.

All these are under Rs 3000 with us because we operate from Abu Road, not Udaipur. No middlemen.

We keep groups to 12 max to keep it secret and safe.

DM us on WhatsApp for GPS pins - we share after booking only to avoid overcrowding.`,date:"28 Nov 2024",author:"Rahul Rathore",readTime:"5 min",emoji:"\uD83C\uDF32",gradient:"from-green-600 to-emerald-700",category:"Hidden Trails"},{id:4,title:"Abu Road to Nakki Lake: Monsoon Trekking Experience",excerpt:"Monsoon turns Aravalli into Western Ghats. Waterfalls on the highway, clouds below your feet, and Nakki Lake full to brim - we did it in July.",content:`Most people avoid Mount Abu in monsoon. That's exactly why you should go.

We started from Abu Road Railway Station at 4 PM in July. Within 5km of ghat, 7 waterfalls were flowing onto the road. Our driver - a local - knew which ones are safe to shower under.

Trek route: Delwara (base) -> Toad Rock -> Nakki Lake upper ridge -> Bailey's Walk -> Sunset Point. 6km, but slippery. We provide Quechua grip shoes free.

At Nakki Lake, the lake was overflowing. Boats closed, but that meant zero crowd. We sat at the old British library cafe, chai and pakora, clouds entering the lake.

What to pack for monsoon Abu Road:
- Poncho, not umbrella (windy)
- 2 pairs socks
- Power bank (leeches love phone warmth)
- Our trek includes leech socks

Cost same Rs 2499 in monsoon. But we add 1 extra hour because waterfalls.

Best time: 15 July - 15 Sep. After that waterfalls dry.

Photos from our July batch attached - no filter needed. Aravalli in green is unreal.`,date:"15 Nov 2024",author:"Sneha Patel",readTime:"4 min",emoji:"\uD83C\uDF27️",gradient:"from-sky-500 to-blue-600",category:"Monsoon"},{id:5,title:"Budget Trekking from Ahmedabad to Abu Road Under Rs 3000 - Pickup/Drop Included",excerpt:"Ahmedabad to Abu Road is just 4 hours. For Rs 2499, we pick you up at 10 PM, trek whole next day, drop by Sunday night. Here's how.",content:`You are in Ahmedabad, you want a weekend trek, but Manali is too far and expensive. Abu Road is your answer.

**The Logistics:**
- Friday 10 PM: Pickup from Paldi / SG Highway / Narol in our 12-seater tempo (with pushback seats, not cramped)
- Sat 2:30 AM: Reach Abu Road, rest at our dorm (included)
- Sat 5:30 AM: Start trek (Mount Abu / Guru Shikhar / Wildlife as per package)
- Sat 4 PM: Back to Abu Road, shower at dorm
- Sat 6 PM: Drop to Abu Road Railway Station OR
- Sun 6 AM: If you want to explore Mount Abu market at night, we drop Sunday morning

**What Rs 2499 includes:** Transport Ahmedabad-Abu Road-Ahmedabad (Rs 800 value), dorm stay, 2 meals, guide, forest permit, first aid.

**What it doesn't:** Personal snacks, Mount Abu entry ticket for Nakki Lake boat (Rs 50).

We have done 400+ Ahmedabad batches. Safety record: 100%. Guides are certified from NIM.

Pickup points:
- Ahmedabad: Paldi, Nehrunagar, SG Highway, Narol, CTM
- Viramgam: Highway touch
- Abu Road: Railway Station, Bus Stand
